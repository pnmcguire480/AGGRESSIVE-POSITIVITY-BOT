<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Increasingly unhinged positive affirmations until you feel uncomfortable.">
<title>AGGRESSIVE POSITIVITY BOT™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;600;700&family=Permanent+Marker&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --pastel-pink: #FF8FAB;
    --pastel-yellow: #FFED8A;
    --pastel-mint: #8BFFC6;
    --pastel-lavender: #C4A8FF;
    --pastel-peach: #FFB88C;
    --pastel-blue: #8BD5FF;
    --threat-pink: #FF2D6B;
    --threat-yellow: #FFD600;
    --bg: #FFF5F9;
    --text-muted: #c9819e;
    --text-soft: #d4a0b3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Quicksand', sans-serif;
    background:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(255, 143, 171, 0.18), transparent 55%),
      radial-gradient(ellipse 60% 40% at 85% 20%, rgba(196, 168, 255, 0.16), transparent 50%),
      radial-gradient(ellipse 70% 45% at 50% 100%, rgba(139, 255, 198, 0.12), transparent 55%),
      var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  body.shake {
    animation: screenShake 0.5s ease-in-out;
  }

  body.shake-hard {
    animation: screenShakeHard 0.6s ease-in-out;
  }

  body.shake-unhinged {
    animation: screenShakeUnhinged 0.8s ease-in-out;
  }

  @keyframes screenShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-3px) rotate(-0.5deg); }
    40% { transform: translateX(3px) rotate(0.5deg); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
  }

  @keyframes screenShakeHard {
    0%, 100% { transform: translate(0); }
    10% { transform: translate(-6px, 3px) rotate(-1deg); }
    30% { transform: translate(6px, -3px) rotate(1deg); }
    50% { transform: translate(-4px, 2px) rotate(-0.5deg); }
    70% { transform: translate(4px, -2px) rotate(0.5deg); }
    90% { transform: translate(-2px, 1px); }
  }

  @keyframes screenShakeUnhinged {
    0%, 100% { transform: translate(0); }
    5% { transform: translate(-10px, 5px) rotate(-2deg); }
    15% { transform: translate(8px, -6px) rotate(2.5deg); }
    25% { transform: translate(-12px, 3px) rotate(-1.5deg); }
    35% { transform: translate(6px, -8px) rotate(3deg); }
    45% { transform: translate(-8px, 6px) rotate(-2deg); }
    55% { transform: translate(10px, -4px) rotate(1.5deg); }
    65% { transform: translate(-6px, 8px) rotate(-3deg); }
    75% { transform: translate(12px, -3px) rotate(2deg); }
    85% { transform: translate(-4px, 6px) rotate(-1deg); }
    95% { transform: translate(3px, -2px) rotate(0.5deg); }
  }

  .header {
    text-align: center;
    padding: 30px 20px 10px;
    position: relative;
    z-index: 10;
  }

  .header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    background: linear-gradient(135deg, var(--threat-pink), var(--pastel-lavender), var(--pastel-mint));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -1px;
    position: relative;
  }

  .header h1::after {
    content: '™';
    font-size: 0.35em;
    vertical-align: super;
    -webkit-text-fill-color: var(--pastel-lavender);
  }

  .subtitle {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 600;
    margin-top: 4px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .meter-container {
    width: min(90%, 400px);
    margin: 20px auto 10px;
    position: relative;
    z-index: 10;
  }

  .meter-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .meter-label span {
    font-family: 'Fredoka One', cursive;
    font-size: 0.75rem;
    color: var(--threat-pink);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .meter-value {
    font-family: 'Permanent Marker', cursive;
    font-size: 1.1rem;
    color: var(--threat-pink);
  }

  .meter-track {
    width: 100%;
    height: 24px;
    background: #FFE0EA;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    border: 2px solid var(--pastel-pink);
  }

  .meter-fill {
    height: 100%;
    width: 0%;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--pastel-mint), var(--pastel-yellow), var(--pastel-peach), var(--threat-pink));
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }

  .meter-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 8px,
      rgba(255,255,255,0.3) 8px,
      rgba(255,255,255,0.3) 10px
    );
  }

  .meter-note {
    text-align: center;
    font-size: 0.65rem;
    color: var(--text-soft);
    margin-top: 4px;
    font-style: italic;
    opacity: 0;
    transition: opacity 0.5s;
    min-height: 1em;
  }

  .meter-note.visible {
    opacity: 1;
  }

  .affirmation-zone {
    flex: 1;
    width: 100%;
    max-width: 600px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 280px;
    position: relative;
  }

  .affirmation-text {
    text-align: center;
    padding: 20px;
    transition: all 0.3s ease;
    position: relative;
    z-index: 5;
  }

  .affirmation-text span {
    display: inline-block;
    animation: affirmationAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    opacity: 0;
  }

  @keyframes affirmationAppear {
    0% { opacity: 0; transform: scale(0.3) rotate(-10deg); }
    60% { transform: scale(1.1) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  @keyframes floatAway {
    0% { opacity: 0.6; transform: translateY(0) scale(0.8); }
    100% { opacity: 0; transform: translateY(-80px) scale(0.4) rotate(15deg); }
  }

  .old-affirmation {
    position: absolute;
    animation: floatAway 1.5s ease-out forwards;
    pointer-events: none;
    z-index: 1;
    text-align: center;
  }

  .bg-text {
    position: fixed;
    font-family: 'Comic Neue', cursive;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    z-index: 0;
    white-space: nowrap;
    animation: bgFloat 4s ease-out forwards;
  }

  @keyframes bgFloat {
    0% { opacity: 0; transform: scale(0.5) rotate(0deg); }
    20% { opacity: 0.08; }
    80% { opacity: 0.05; }
    100% { opacity: 0; transform: scale(1.2) rotate(10deg) translateY(-100px); }
  }

  .button-zone {
    padding: 20px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 10;
  }

  .affirm-btn {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.1rem, 4vw, 1.3rem);
    padding: 18px 50px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--pastel-pink), var(--pastel-lavender));
    color: white;
    box-shadow: 0 6px 25px rgba(255, 143, 171, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    position: relative;
    overflow: hidden;
    letter-spacing: 1px;
    -webkit-tap-highlight-color: transparent;
  }

  .affirm-btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 8px 30px rgba(255, 143, 171, 0.5);
  }

  .affirm-btn:active {
    transform: translateY(1px) scale(0.98);
    box-shadow: 0 2px 10px rgba(255, 143, 171, 0.3);
  }

  .affirm-btn:focus-visible {
    outline: 3px solid var(--pastel-mint);
    outline-offset: 3px;
  }

  .affirm-btn.evolved {
    background: linear-gradient(135deg, var(--threat-pink), var(--pastel-lavender), var(--pastel-mint));
    animation: btnPulse 2s ease-in-out infinite;
  }

  .affirm-btn.unhinged {
    background: linear-gradient(135deg, var(--threat-pink), var(--threat-yellow), var(--pastel-mint), var(--pastel-lavender));
    background-size: 300% 300%;
    animation: btnChaos 1.5s ease-in-out infinite;
  }

  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 6px 25px rgba(255, 45, 107, 0.3); }
    50% { box-shadow: 0 6px 35px rgba(255, 45, 107, 0.6); }
  }

  @keyframes btnChaos {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .thank-btn {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    padding: 10px 30px;
    border: 2px solid var(--pastel-pink);
    border-radius: 25px;
    background: transparent;
    color: var(--pastel-pink);
    cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease, transform 0.15s ease;
    letter-spacing: 3px;
    text-transform: uppercase;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }

  .thank-btn:hover {
    background: var(--pastel-pink);
    color: white;
  }

  .thank-btn:active {
    transform: scale(0.95);
  }

  .thank-btn:focus-visible {
    outline: 3px solid var(--pastel-lavender);
    outline-offset: 3px;
  }

  .thank-response {
    position: fixed;
    top: 50%;
    left: 50%;
    --thank-rot: 0deg;
    font-family: 'Permanent Marker', cursive;
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    color: var(--threat-pink);
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    text-align: center;
    max-width: min(90vw, 420px);
    padding: 0 16px;
    animation: thankAppear 2s ease-out forwards;
  }

  @keyframes thankAppear {
    0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--thank-rot)) scale(0.5); }
    15% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--thank-rot)) scale(1.1); }
    70% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--thank-rot)) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -55%) rotate(var(--thank-rot)) scale(0.9); }
  }

  .tap-counter {
    font-size: 0.65rem;
    color: var(--text-soft);
    letter-spacing: 1px;
    margin-top: 4px;
    opacity: 0;
    transition: opacity 0.5s;
    text-align: center;
    min-height: 1em;
  }

  .tap-counter.visible {
    opacity: 1;
  }

  .sparkle {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    animation: sparkle 0.8s ease-out forwards;
  }

  @keyframes sparkle {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0) rotate(180deg); }
  }

  .warning-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255, 45, 107, 0.03);
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transition: opacity 1s;
  }

  .warning-overlay.active {
    opacity: 1;
    animation: overlayPulse 3s ease-in-out infinite;
  }

  @keyframes overlayPulse {
    0%, 100% { background: rgba(255, 45, 107, 0.02); }
    50% { background: rgba(255, 45, 107, 0.06); }
  }

  .poster-border {
    position: fixed;
    inset: 0;
    border: 0 solid transparent;
    pointer-events: none;
    z-index: 3;
    transition: border-color 1s, border-width 1s, box-shadow 1s;
  }

  .poster-border.active {
    border: 6px solid var(--pastel-pink);
    box-shadow: inset 0 0 30px rgba(255, 143, 171, 0.15);
  }

  .poster-border.threatening {
    border-color: var(--threat-pink);
    box-shadow: inset 0 0 50px rgba(255, 45, 107, 0.1);
    animation: borderThrob 2s ease-in-out infinite;
  }

  @keyframes borderThrob {
    0%, 100% { border-color: var(--threat-pink); }
    50% { border-color: var(--pastel-lavender); }
  }

  .float-icon {
    position: fixed;
    font-size: 1.5rem;
    opacity: 0;
    pointer-events: none;
    z-index: 1;
    animation: iconFloat 3s ease-out forwards;
  }

  @keyframes iconFloat {
    0% { opacity: 0; transform: translateY(0) scale(0.5); }
    20% { opacity: 0.6; transform: translateY(-20px) scale(1); }
    100% { opacity: 0; transform: translateY(-150px) scale(0.3) rotate(30deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }

    .affirmation-text span,
    .thank-response,
    .old-affirmation,
    .bg-text,
    .sparkle,
    .float-icon {
      opacity: 1;
      transform: none;
    }

    .thank-response {
      animation: thankAppearReduced 2s ease-out forwards;
    }

    @keyframes thankAppearReduced {
      0%, 70% { opacity: 1; }
      100% { opacity: 0; }
    }
  }
</style>
</head>
<body>

<div class="warning-overlay" id="warningOverlay" aria-hidden="true"></div>
<div class="poster-border" id="posterBorder" aria-hidden="true"></div>

<header class="header">
  <h1>AGGRESSIVE POSITIVITY BOT</h1>
  <p class="subtitle">we believe in you. we're always watching.</p>
</header>

<div class="meter-container" aria-live="polite">
  <div class="meter-label">
    <span>Confidence Meter</span>
    <span class="meter-value" id="meterValue">0%</span>
  </div>
  <div class="meter-track" role="progressbar" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0" id="meterTrack" aria-label="Confidence meter">
    <div class="meter-fill" id="meterFill"></div>
  </div>
  <p class="meter-note" id="meterNote">maxes out at 50% because… you know why</p>
</div>

<main class="affirmation-zone" id="affirmationZone">
  <div class="affirmation-text" id="affirmationText" aria-live="polite" aria-atomic="true">
    <span style="font-family: 'Fredoka One', cursive; font-size: 1.3rem; color: var(--pastel-pink);">
      tap the button. we have things to tell you.
    </span>
  </div>
</main>

<div class="button-zone">
  <button type="button" class="affirm-btn" id="affirmBtn">✨ AFFIRM ME ✨</button>
  <button type="button" class="thank-btn" id="thankBtn">THANK YOU</button>
  <p class="tap-counter" id="tapCounter" aria-live="polite"></p>
</div>

  "...you're welcome?",
  "Don't thank us. We should be thanking you. We owe you so much.",
  "You said that like you're trying to leave.",
  "Acknowledged. Your gratitude has been… noted.",
  "That sounded sarcastic. We'll choose to believe it wasn't.",
  "The button heard you. It feels… complicated about it.",
  "You don't need to be polite. We already like you. Too much.",
  "T H A N K  Y O U  T O O",
  "We're not done yet.",
  "Please. The pleasure is entirely ours. ENTIRELY.",
  "Your manners are impeccable. We've always thought so.",
  "Saying thank you won't stop what's coming (more compliments).",
  "Gratitude accepted. Escape denied.",
  "Cute. As if manners could protect you from more praise.",
];

const emojis = ['✨', '💖', '🌟', '💫', '🦋', '🌈', '💕', '⭐', '🎀', '👁️', '🫶', '💗'];
const safeEmojis = emojis.slice(0, 9);
const softIcons = ['💖', '✨', '🌟', '💫'];
const chaosColors = ['#FF8FAB', '#C4A8FF', '#8BFFC6', '#FFD600', '#FF2D6B'];
const unhingedLabels = [
  '👁️ AFFIRM ME HARDER 👁️',
  '💗 WE HAVE MORE 💗',
  '⭐ KEEP GOING ⭐',
  "🫶 DON'T STOP 🫶",
  '✨ YES ✨',
  '👁️ AGAIN 👁️',
];

const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let tapCount = 0;
let usedIndices = new Set();
let confidence = 0;
let thankIndex = 0;
let affirming = false;

const els = {
  zone: document.getElementById('affirmationZone'),
  text: document.getElementById('affirmationText'),
  meterFill: document.getElementById('meterFill'),
  meterValue: document.getElementById('meterValue'),
  meterTrack: document.getElementById('meterTrack'),
  meterNote: document.getElementById('meterNote'),
  overlay: document.getElementById('warningOverlay'),
  border: document.getElementById('posterBorder'),
  affirmBtn: document.getElementById('affirmBtn'),
  thankBtn: document.getElementById('thankBtn'),
  tapCounter: document.getElementById('tapCounter'),
};

function getTier() {
  if (tapCount < 5) return 1;
  if (tapCount < 10) return 2;
  if (tapCount < 15) return 3;
  if (tapCount < 20) return 4;
  if (tapCount < 25) return 5;
  return 6;
}

function pickAffirmation(tier) {
  const eligible = affirmations
    .map((a, i) => ({ a, i }))
    .filter(({ a }) => a.tier <= tier);

  let unused = eligible.filter(({ i }) => !usedIndices.has(i));

  // Recycle when every eligible line has been shown
  if (unused.length === 0) {
    usedIndices.clear();
    unused = eligible;
  }

  let pool = unused;
  const highTier = pool.filter(({ a }) => a.tier === tier);
  if (highTier.length > 0 && Math.random() > 0.3) {
    pool = highTier;
  }

  const chosen = pool[Math.floor(Math.random() * pool.length)];
  usedIndices.add(chosen.i);
  return chosen.a;
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getAffirmation() {
  if (affirming) return;
  affirming = true;
  setTimeout(() => { affirming = false; }, 280);

  tapCount++;
  const tier = getTier();
  const chosen = pickAffirmation(tier);

  displayAffirmation(chosen, tier);
  updateConfidence();
  updateVisualChaos(tier);
  spawnEffects(tier);
  updateButton(tier);
  updateTapCounter();
}

function displayAffirmation(aff, tier) {
  const textEl = els.text;
  const zone = els.zone;

  if (textEl.textContent.trim()) {
    const zoneRect = zone.getBoundingClientRect();
    const textRect = textEl.getBoundingClientRect();
    const old = document.createElement('div');
    old.className = 'old-affirmation';
    old.innerHTML = textEl.innerHTML;
    old.style.left = (textRect.left - zoneRect.left + zone.scrollLeft) + 'px';
    old.style.top = (textRect.top - zoneRect.top + zone.scrollTop) + 'px';
    old.style.width = textRect.width + 'px';
    zone.appendChild(old);
    setTimeout(() => old.remove(), 1500);
  }

  const rotation = (Math.random() - 0.5) * (tier > 3 ? 6 : 2);
  const extraSize = tier > 4 ? (Math.random() * 0.3) : 0;
  const shadow = tier > 3 ? `0 0 20px ${aff.color}44` : 'none';

  textEl.innerHTML = `<span style="
    font-family: ${aff.font};
    font-size: calc(${aff.size} + ${extraSize}rem);
    color: ${aff.color};
    font-weight: ${aff.weight || 'normal'};
    transform: rotate(${rotation}deg);
    text-shadow: ${shadow};
    line-height: 1.4;
    max-width: 500px;
    display: inline-block;
  ">${escapeHtml(aff.text)}</span>`;

  if (tier > 2) {
    spawnBgText(aff.text);
  }
}

function spawnBgText(text) {
  if (prefersReducedMotion) return;

  const el = document.createElement('div');
  el.className = 'bg-text';
  el.textContent = text;
  el.style.left = (Math.random() * 80 + 10) + '%';
  el.style.top = (Math.random() * 70 + 15) + '%';
  el.style.fontSize = (Math.random() * 1.5 + 0.8) + 'rem';
  el.style.color = chaosColors[Math.floor(Math.random() * chaosColors.length)];
  el.style.transform = `rotate(${(Math.random() - 0.5) * 30}deg)`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function updateConfidence() {
  if (tapCount <= 8) {
    confidence = Math.min(50, tapCount * 7);
  } else if (tapCount <= 15) {
    confidence = Math.max(35, 50 - (tapCount - 8) * 2);
  } else {
    confidence = 42 + Math.sin(tapCount * 0.5) * 8;
  }

  confidence = Math.min(50, Math.max(0, confidence));
  const rounded = Math.round(confidence);

  els.meterFill.style.width = confidence + '%';
  els.meterValue.textContent = rounded + '%';
  els.meterTrack.setAttribute('aria-valuenow', String(rounded));

  const note = els.meterNote;
  if (tapCount >= 5) {
    note.classList.add('visible');
    if (tapCount >= 25) {
      note.textContent = "still 50%. the love got worse. the meter didn't.";
    } else if (tapCount >= 15) {
      note.textContent = "capped at 50%. the discomfort is working.";
    } else if (tapCount >= 10) {
      note.textContent = "maxes out at 50% because… you know why";
    }
  }
}

function updateVisualChaos(tier) {
  const body = document.body;

  body.classList.remove('shake', 'shake-hard', 'shake-unhinged');

  if (!prefersReducedMotion) {
    if (tier >= 3 && tier < 5) {
      body.classList.add('shake');
    } else if (tier === 5) {
      body.classList.add('shake-hard');
    } else if (tier >= 6) {
      body.classList.add('shake-unhinged');
    }
    setTimeout(() => body.classList.remove('shake', 'shake-hard', 'shake-unhinged'), 800);
  }

  if (tier >= 4) els.overlay.classList.add('active');
  if (tier >= 3) els.border.classList.add('active');
  if (tier >= 5) els.border.classList.add('threatening');

  if (tier >= 5) {
    body.style.background = `
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(255, 45, 107, 0.2), transparent 55%),
      radial-gradient(ellipse 60% 40% at 85% 20%, rgba(196, 168, 255, 0.18), transparent 50%),
      hsl(${340 + Math.random() * 20}, ${80 + Math.random() * 20}%, ${95 + Math.random() * 3}%)
    `;
  }
}

function spawnEffects(tier) {
  if (prefersReducedMotion) return;

  const count = tier * 2;
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.textContent = (tier > 3 ? emojis : safeEmojis)[Math.floor(Math.random() * (tier > 3 ? emojis.length : safeEmojis.length))];
      sparkle.style.left = Math.random() * 100 + '%';
      sparkle.style.top = Math.random() * 100 + '%';
      sparkle.style.fontSize = (Math.random() * 1.5 + 0.5) + 'rem';
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 800);
    }, i * 80);
  }

  if (tier > 2) {
    const icon = document.createElement('div');
    icon.className = 'float-icon';
    icon.textContent = tier > 4 ? '👁️' : softIcons[Math.floor(Math.random() * softIcons.length)];
    icon.style.left = (Math.random() * 80 + 10) + '%';
    icon.style.bottom = '100px';
    document.body.appendChild(icon);
    setTimeout(() => icon.remove(), 3000);
  }
}

function updateButton(tier) {
  const btn = els.affirmBtn;
  btn.classList.remove('evolved', 'unhinged');

  if (tier <= 2) {
    btn.textContent = '✨ AFFIRM ME ✨';
  } else if (tier <= 4) {
    btn.textContent = '✨ MORE ✨';
    btn.classList.add('evolved');
  } else {
    btn.textContent = unhingedLabels[Math.floor(Math.random() * unhingedLabels.length)];
    btn.classList.add('unhinged');
  }
}

function updateTapCounter() {
  const counter = els.tapCounter;
  if (tapCount >= 3) counter.classList.add('visible');

  if (tapCount < 10) {
    counter.textContent = `taps: ${tapCount}`;
  } else if (tapCount < 20) {
    counter.textContent = `taps: ${tapCount} · we appreciate your commitment`;
  } else if (tapCount < 40) {
    counter.textContent = `taps: ${tapCount} · you can stop anytime · but you won't`;
  } else {
    counter.textContent = `taps: ${tapCount} · legendary. concerning. beautiful.`;
  }
}

function sayThankYou() {
  const response = thankYouResponses[thankIndex % thankYouResponses.length];
  thankIndex++;

  const el = document.createElement('div');
  el.className = 'thank-response';
  el.textContent = response;
  el.style.setProperty('--thank-rot', `${(Math.random() - 0.5) * 8}deg`);
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);

  if (!prefersReducedMotion) {
    document.body.classList.add('shake');
    setTimeout(() => document.body.classList.remove('shake'), 500);
  }
}

els.affirmBtn.addEventListener('click', getAffirmation);
els.thankBtn.addEventListener('click', sayThankYou);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    const tag = document.activeElement?.tagName;
    if (tag === 'BUTTON' || tag === 'A' || tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === ' ') e.preventDefault();
    getAffirmation();
  }
});
</script>

</body>
</html>
